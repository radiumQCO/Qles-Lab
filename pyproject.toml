[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qles-lab"
version = "1.0.0"
description = "Quantum Learning & Engineering Lab — offline Windows scientific sandbox"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "PySide6>=6.8,<7", "stim>=1.15,<2", "pymatching>=2.3,<3"]

[project.scripts]
qles-lab = "qles_lab.app:main"

[tool.setuptools.packages.find]
include = ["qles_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
